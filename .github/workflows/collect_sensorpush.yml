name: Collect SensorPush readings

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]==3.3.4" requests==2.34.2

      - name: Collect latest SensorPush readings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENSORPUSH_EMAIL: ${{ secrets.SENSORPUSH_EMAIL }}
          SENSORPUSH_PASSWORD: ${{ secrets.SENSORPUSH_PASSWORD }}
          SENSORPUSH_POLL_LIMIT: ${{ secrets.SENSORPUSH_POLL_LIMIT }}
        run: python collect_latest_supabase.py
